<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <defs>
    <linearGradient id="dlGold" gradientUnits="userSpaceOnUse" x1="30" y1="280" x2="260" y2="30">
      <stop offset="0" stop-color="#BF8B4B"/>
      <stop offset="0.55" stop-color="#E2BC74"/>
      <stop offset="1" stop-color="#F0D597"/>
    </linearGradient>
    <linearGradient id="dlTeal" gradientUnits="userSpaceOnUse" x1="60" y1="270" x2="300" y2="40">
      <stop offset="0" stop-color="#3E9AAE"/>
      <stop offset="1" stop-color="#86D2D7"/>
    </linearGradient>
    <linearGradient id="dlHair" gradientUnits="userSpaceOnUse" x1="0" y1="27" x2="0" y2="60">
      <stop offset="0" stop-color="#E9E3C4"/>
      <stop offset="1" stop-color="#7FCFD5"/>
    </linearGradient>
    <radialGradient id="dlGlow">
      <stop offset="0" stop-color="#DFFBFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#9BEAF2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5FD0DE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <!-- d: palo + panza dorada -->
    <path d="M181 26 L181 126 A88 88 0 1 0 179 250 L256 140 L256 46" stroke="url(#dlGold)"/>
    <!-- horquilla de arriba (dorado a turquesa) -->
    <path d="M256 46 A18 18 0 0 0 220 46" stroke="url(#dlHair)"/>
    <path d="M220 46 L220 146" stroke="url(#dlTeal)"/>
    <!-- c turquesa interior -->
    <path d="M158 158 A50 50 0 1 0 112 238 L200 166" stroke="url(#dlTeal)"/>
    <!-- L pequeña con punto -->
    <path d="M250 180 L250 214 Q250 229 265 229 L300 229" stroke="url(#dlTeal)"/>
    <!-- curva de abajo -->
    <path d="M222 206 L222 240 Q222 265 247 265 L300 265" stroke="url(#dlTeal)"/>
  </g>
  <circle cx="306" cy="230" r="30" fill="url(#dlGlow)"/>
  <circle cx="306" cy="230" r="10" fill="#E8FDFF"/>
</svg>
